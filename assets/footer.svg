<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">VELI system online</title>
  <desc id="desc">A quiet terminal footer showing the VELI system online status.</desc>
  <defs>
    <linearGradient id="footer-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090f19" />
      <stop offset="1" stop-color="#111326" />
    </linearGradient>
    <linearGradient id="footer-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42e8b4" />
      <stop offset="0.5" stop-color="#32d9ff" />
      <stop offset="1" stop-color="#c4b5fd" />
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .pulse { animation: pulse 4.4s ease-in-out infinite; }
      .cursor { animation: cursor 1.15s steps(1, end) infinite; }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes cursor { 0%, 46% { opacity: 1; } 47%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .pulse, .cursor { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="190" rx="16" fill="url(#footer-bg)" />
  <rect x="1" y="1" width="1198" height="188" rx="15" fill="none" stroke="#263449" stroke-width="2" />
  <path d="M32 39H1168" stroke="#263449" />
  <path d="M32 39H438" stroke="url(#footer-line)" stroke-width="2" stroke-linecap="round" />

  <g class="mono">
    <circle cx="64" cy="88" r="8" fill="#42e8b4" fill-opacity="0.16" class="pulse" />
    <circle cx="64" cy="88" r="4" fill="#42e8b4" class="pulse" />
    <text x="92" y="96" font-size="30" font-weight="700" letter-spacing="2.2" fill="#f4f8ff">VELI SYSTEM ONLINE</text>
    <text x="92" y="125" font-size="12" letter-spacing="1.8" fill="#71839d">BUILD WITH INTENT  ·  SHIP WITH CLARITY  ·  KEEP THE SIGNAL CLEAN</text>
    <text x="92" y="157" font-size="11" letter-spacing="1.5" fill="#32d9ff">/root/veli/status</text>
    <text x="232" y="157" font-size="11" letter-spacing="1.5" fill="#8b9ab2">ready for the next build</text>
    <rect x="426" y="145" width="7" height="15" rx="1" fill="#42e8b4" class="cursor" />
  </g>

  <text x="1168" y="160" text-anchor="end" class="mono" font-size="10" letter-spacing="1.5" fill="#71839d">VELIAN / 001</text>
</svg>
