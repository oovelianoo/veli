<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">VELIAN / Daniil Terekhov — Founder of VELI Technologies</title>
  <desc id="desc">A dark premium terminal panel introducing Daniil Terekhov and the VELI Technologies identity system.</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c15" />
      <stop offset="0.58" stop-color="#0b1220" />
      <stop offset="1" stop-color="#111126" />
    </linearGradient>
    <linearGradient id="hero-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#32d9ff" stop-opacity="0.1" />
      <stop offset="0.5" stop-color="#32d9ff" stop-opacity="0.72" />
      <stop offset="1" stop-color="#9b8cff" stop-opacity="0.18" />
    </linearGradient>
    <linearGradient id="hero-progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42e8b4" />
      <stop offset="0.62" stop-color="#32d9ff" />
      <stop offset="1" stop-color="#9b8cff" />
    </linearGradient>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .soft-pulse { animation: soft-pulse 4.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .cursor { animation: cursor 1.15s steps(1, end) infinite; }
      .reveal-a { animation: reveal 1.2s ease-out both; }
      .reveal-b { animation: reveal 1.2s 0.18s ease-out both; }
      .reveal-c { animation: reveal 1.2s 0.34s ease-out both; }
      @keyframes soft-pulse {
        0%, 100% { opacity: 0.34; }
        50% { opacity: 0.92; }
      }
      @keyframes cursor {
        0%, 45% { opacity: 1; }
        46%, 100% { opacity: 0; }
      }
      @keyframes reveal {
        from { opacity: 0; transform: translateX(-8px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .soft-pulse, .cursor, .reveal-a, .reveal-b, .reveal-c { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="370" rx="18" fill="url(#hero-bg)" />
  <rect x="1" y="1" width="1198" height="368" rx="17" fill="none" stroke="#263449" stroke-width="2" />
  <rect x="20" y="20" width="1160" height="330" rx="14" fill="#080d17" fill-opacity="0.54" stroke="url(#hero-edge)" stroke-width="1.5" />

  <rect x="20" y="20" width="1160" height="44" rx="14" fill="#0d1522" />
  <path d="M20 64H1180" stroke="#233247" />
  <circle cx="47" cy="42" r="5" fill="#fb7185" fill-opacity="0.9" />
  <circle cx="65" cy="42" r="5" fill="#f3c969" fill-opacity="0.9" />
  <circle cx="83" cy="42" r="5" fill="#42e8b4" fill-opacity="0.9" />
  <text x="108" y="47" class="mono" font-size="12" letter-spacing="2.5" fill="#8b9ab2">VELI / IDENTITY NODE</text>
  <circle cx="1061" cy="42" r="4" fill="#42e8b4" class="soft-pulse" filter="url(#soft-glow)" />
  <text x="1075" y="47" class="mono" font-size="11" letter-spacing="1.5" fill="#7f91aa">LIVE LINK</text>

  <g class="mono">
    <text x="62" y="105" font-size="14" letter-spacing="1.4" fill="#42e8b4">root@veli:~$ whoami</text>
    <rect x="252" y="91" width="8" height="18" rx="1" fill="#42e8b4" class="cursor" />

    <text x="60" y="165" font-size="54" font-weight="700" letter-spacing="1.5" fill="#f4f8ff" class="reveal-a">VELIAN</text>
    <text x="62" y="195" font-size="21" letter-spacing="0.6" fill="#a9b7cb" class="reveal-b">Daniil Terekhov</text>
    <text x="62" y="224" font-size="16" letter-spacing="0.4" fill="#32d9ff" class="reveal-c">Founder of VELI Technologies</text>
    <path d="M62 244H650" stroke="#263449" />
    <path d="M62 244H366" stroke="url(#hero-progress)" stroke-width="2" stroke-linecap="round" />
    <text x="62" y="276" font-size="13" letter-spacing="1.6" fill="#8b9ab2">AI SYSTEMS  ·  CGI  ·  3D  ·  AUTOMATION</text>
    <text x="62" y="301" font-size="13" letter-spacing="1.6" fill="#8b9ab2">PRODUCT BUILDING  ·  LOCAL-FIRST SOFTWARE</text>
  </g>

  <g class="mono">
    <rect x="716" y="91" width="414" height="194" rx="10" fill="#0d1522" stroke="#25364d" />
    <path d="M716 127H1130" stroke="#25364d" />
    <circle cx="741" cy="109" r="4" fill="#32d9ff" class="soft-pulse" />
    <text x="756" y="113" font-size="11" letter-spacing="2" fill="#8b9ab2">SYSTEM PROFILE / 001</text>

    <text x="740" y="153" font-size="11" letter-spacing="1.5" fill="#71839d">SYSTEM</text>
    <text x="872" y="153" font-size="12" letter-spacing="0.9" fill="#e7eef9">VELI TECHNOLOGIES</text>
    <text x="740" y="181" font-size="11" letter-spacing="1.5" fill="#71839d">MODE</text>
    <text x="872" y="181" font-size="12" letter-spacing="0.9" fill="#42e8b4">PRODUCT BUILDING</text>
    <text x="740" y="209" font-size="11" letter-spacing="1.5" fill="#71839d">DOMAIN</text>
    <text x="872" y="209" font-size="12" letter-spacing="0.9" fill="#32d9ff">AI / CGI / 3D</text>
    <text x="740" y="237" font-size="11" letter-spacing="1.5" fill="#71839d">RUNTIME</text>
    <text x="872" y="237" font-size="12" letter-spacing="0.9" fill="#c4b5fd">LOCAL-FIRST</text>
    <path d="M740 258H1106" stroke="#263449" />
    <path d="M740 258H1004" stroke="url(#hero-progress)" stroke-width="2" stroke-linecap="round" class="soft-pulse" />
    <text x="740" y="276" font-size="10" letter-spacing="1.3" fill="#71839d">STATUS / BUILDING IN PUBLIC</text>
  </g>

  <rect x="20" y="20" width="1160" height="1" fill="#32d9ff" fill-opacity="0.25" />
  <rect x="28" y="72" width="1144" height="1" fill="#32d9ff" fill-opacity="0.05">
    <animate attributeName="y" from="72" to="342" dur="7s" repeatCount="indefinite" />
  </rect>
</svg>
